[project]
name = "career-os-backend"
version = "0.1.0"
description = "AI Career Operating System — FastAPI backend"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pydantic[email]>=2",
    "pydantic-settings>=2.14.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.52.1",
    "boto3>=1.43.64",
    "weasyprint>=69.0",
    "jinja2>=3.1.6",
    "anthropic>=0.120.2",
    "openai>=2.53.0",
    "tiktoken>=0.13.0",
    "aiosmtplib>=5.1.2",
    "pymupdf>=1.28.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests", "features"]
asyncio_mode = "auto"

[tool.mypy]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = "weasyprint"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.64",
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
    "types-python-jose>=3.5.0.20260408",
]
